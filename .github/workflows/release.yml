# Builds Candy Box 2's terminal edition for the Asciiverse catalog: one
# archive per target, candybox2-<target>.tar.gz (.zip on Windows), plus
# SHA256SUMS, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github"). Runs on our tags (*-av.*), or by hand for an
# existing tag.
#
# Built by asciiverse/Makefile: the game's TypeScript through upstream's own
# TypeScript 1.7.5 (node), tty/ beside it, all compiled to one native
# program by QuickJS-ng's qjsc. Nothing is needed to run it. Linux builds
# are static musl, made in Alpine; Windows is cross-built with MinGW (qjsc
# itself runs on the build machine).

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base nodejs npm python3 &&
            make -f asciiverse/Makefile LDFLAGS="-static -s" VERSION="${{ env.TAG }}" &&
            asciiverse/package.sh ${{ matrix.target }}'
          file out/candybox2

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          make -f asciiverse/Makefile CC=clang HOSTCC=clang \
            CFLAGS="-O2 -arch ${{ matrix.arch }}" LDFLAGS="-arch ${{ matrix.arch }}" VERSION="$TAG"
          strip out/candybox2
          file out/candybox2
          otool -L out/candybox2
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-pc-windows-gnu
      CROSS: x86_64-w64-mingw32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 zip
          make -f asciiverse/Makefile CC=$CROSS-gcc HOSTCC=gcc EXE=.exe LDFLAGS="-static -s" VERSION="$TAG"
          file out/candybox2.exe
          $CROSS-objdump -p out/candybox2.exe | grep "DLL Name"
          asciiverse/package.sh $TARGET

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "candybox2 $TAG" \
                 --notes "Candy Box 2 by aniwey $TAG, the terminal edition with the changes in PATCHES.md, built for the Asciiverse catalog."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
